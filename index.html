<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chăm team 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --light: #f4f7f6; --danger: #e74c3c; --info: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 10px; margin: 0; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; font-size: 1.5rem; }
        .controls { text-align: center; margin-bottom: 20px; }
        .btn-refresh { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-refresh:hover { background: #219150; transform: scale(1.05); }

        .status { text-align: center; color: #666; font-style: italic; margin-bottom: 15px; font-size: 0.8rem; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { border: 1px solid #ddd; padding: 12px 8px; text-align: center; font-size: 0.9rem; }
        th { background: var(--secondary); color: white; }
        
        .qualified { background-color: #e8f5e9 !important; font-weight: bold; color: #2e7d32; }
        .section-title { border-left: 5px solid var(--secondary); padding-left: 10px; margin-top: 30px; color: var(--primary); font-size: 1.2rem; }
        
        /* CSS cho phần Thu Chi */
        .finance-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .card { padding: 15px; border-radius: 8px; text-align: center; color: white; }
        .bg-total { background: var(--info); } .bg-spent { background: var(--danger); } .bg-remain { background: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🏸 LIVE: Chăm team 2026</h1>
    
    <div class="controls">
        <button class="btn-refresh" onclick="refreshAllData()">🔄 Cập nhật dữ liệu</button>
        <p class="status" id="load-status">Đang nạp dữ liệu...</p>
    </div>

    <h2 class="section-title">Bảng Xếp Hạng</h2>
    <div class="table-responsive">
        <table id="table-standings">
            <thead>
                <tr><th>Bảng</th><th>Hạng</th><th>Đội</th><th>Trận</th><th>Thắng</th><th>Thua</th><th>Điểm</th><th>Trạng thái</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h2 class="section-title">Lịch Thi Đấu & Kết Quả</h2>
    <div class="table-responsive"><table id="table-matches"><thead></thead><tbody></tbody></table></div>

    <h2 class="section-title">Quản Lý Thu Chi</h2>
    <div class="finance-summary">
        <div class="card bg-total"><h3>Tổng Thu</h3><p id="total-in">0đ</p></div>
        <div class="card bg-spent"><h3>Tổng Chi</h3><p id="total-out">0đ</p></div>
        <div class="card bg-remain"><h3>Còn Lại</h3><p id="balance">0đ</p></div>
    </div>
    <div class="table-responsive"><table id="table-finance"><thead></thead><tbody></tbody></table></div>
</div>

<script>
    const sheetLinks = {
        matches: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUoFtqaOaU8pLTLpo6FAd4rdqgH0JPg0tpqP0C8MeiQ9cfD6s9R4-CgDPjbwTicqrGWNzXi25u1dI/pub?gid=1302524989&single=true&output=csv",
        finance: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUoFtqaOaU8pLTLpo6FAd4rdqgH0JPg0tpqP0C8MeiQ9cfD6s9R4-CgDPjbwTicqrGWNzXi25u1dI/pub?gid=405520871&single=true&output=csv"
    };

    function refreshAllData() {
        document.getElementById('load-status').textContent = "Đang làm mới...";
        loadSheetData(sheetLinks.matches, 'table-matches');
        loadSheetData(sheetLinks.finance, 'table-finance');
    }

    function loadSheetData(url, tableId) {
        // Thêm tham số ngẫu nhiên để tránh trình duyệt cache dữ liệu cũ
        const cacheBuster = url + "&t=" + new Date().getTime();
        
        Papa.parse(cacheBuster, {
            download: true,
            header: false,
            complete: function(results) {
                const data = results.data;
                const table = document.getElementById(tableId);
                if (!table) return;

                const thead = table.querySelector('thead');
                const tbody = table.querySelector('tbody');
                if (tableId !== 'table-standings') { thead.innerHTML = ""; tbody.innerHTML = ""; }

                let totalIn = 0, totalOut = 0;
                let matchResults = [];

                // Dò index cột cho Lịch thi đấu
                let colGroup = 2, colTeams = 1, colScore = 3; 
                
                data.forEach((row, index) => {
                    if (row.join('').trim().length === 0) return;

                    if (index === 0) {
                        // Vẽ Header cho bảng gốc
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const th = document.createElement('th');
                            th.textContent = cell;
                            tr.appendChild(th);
                        });
                        thead.appendChild(tr);
                        
                        // Tự động tìm cột dựa theo tên tiêu đề để tránh bị lệch do cột trống
                        row.forEach((cell, i) => {
                            let txt = cell.toLowerCase().trim();
                            if (txt.includes("bảng")) colGroup = i;
                            if (txt.includes("đội")) colTeams = i;
                            if (txt.includes("tỷ số") || txt.includes("tỉ số")) colScore = i;
                        });
                    } else {
                        // Xử lý dữ liệu hàng
                        const tr = document.createElement('tr');
                        row.forEach(cell => {
                            const td = document.createElement('td');
                            td.textContent = cell;
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);

                        // Lưu dữ liệu để tính BXH
                        if (tableId === 'table-matches') {
                            matchResults.push({
                                group: row[colGroup],
                                teams: row[colTeams],
                                score: row[colScore]
                            });
                        }
                        
                        // Thu chi
                        if (tableId === 'table-finance') {
                            // Giả định cột tiền Thu là index 1, Chi là index 7 dựa trên image trước đó
                            totalIn += parseInt(row[1]?.toString().replace(/[^0-9]/g, "")) || 0;
                            totalOut += parseInt(row[7]?.toString().replace(/[^0-9]/g, "")) || 0;
                        }
                    }
                });

                if (tableId === 'table-matches') updateStandings(matchResults);
                if (tableId === 'table-finance') {
                    document.getElementById('total-in').textContent = totalIn.toLocaleString() + "đ";
                    document.getElementById('total-out').textContent = totalOut.toLocaleString() + "đ";
                    document.getElementById('balance').textContent = (totalIn - totalOut).toLocaleString() + "đ";
                }
                document.getElementById('load-status').textContent = "Cập nhật lúc: " + new Date().toLocaleTimeString();
            }
        });
    }

    function updateStandings(matches) {
        let stats = {};

        matches.forEach(m => {
            if (!m.score || !m.score.includes('-')) return;
            
            // Tách tên 2 đội (ví dụ: "A vs B")
            let teamNames = m.teams.split(/vs|Và|-/i).map(t => t.trim());
            if (teamNames.length < 2) return;

            // Tách tỷ số
            let scores = m.score.split('-').map(s => parseInt(s.trim()));
            if (isNaN(scores[0]) || isNaN(scores[1])) return;

            // Khởi tạo stats nếu chưa có
            teamNames.forEach(name => {
                if (!stats[name]) stats[name] = { name: name, group: m.group, played: 0, win: 0, lose: 0, pts: 0 };
            });

            // Cộng trận đã chơi
            stats[teamNames[0]].played++;
            stats[teamNames[1]].played++;

            // Tính thắng thua (Luật Thắng 1đ, Thua 0đ)
            if (scores[0] > scores[1]) {
                stats[teamNames[0]].win++; stats[teamNames[0]].pts++;
                stats[teamNames[1]].lose++;
            } else if (scores[1] > scores[0]) {
                stats[teamNames[1]].win++; stats[teamNames[1]].pts++;
                stats[teamNames[0]].lose++;
            }
        });

        // Sắp xếp theo Bảng -> Điểm cao đứng trước
        const sorted = Object.values(stats).sort((a, b) => a.group.localeCompare(b.group) || b.pts - a.pts);
        
        const bxhBody = document.querySelector('#table-standings tbody');
        bxhBody.innerHTML = "";
        
        let currentGroup = "", rank = 0;
        sorted.forEach(s => {
            if (s.group !== currentGroup) { currentGroup = s.group; rank = 1; } else { rank++; }
            
            const tr = document.createElement('tr');
            if (rank <= 2) tr.classList.add('qualified'); // Highlight 2 đội đầu
            
            tr.innerHTML = `
                <td>${s.group}</td>
                <td>${rank}</td>
                <td>${s.name}</td>
                <td>${s.played}</td>
                <td>${s.win}</td>
                <td>${s.lose}</td>
                <td>${s.pts}</td>
                <td>${rank <= 2 ? '🔥 Vào BK' : '-'}</td>
            `;
            bxhBody.appendChild(tr);
        });
    }

    window.onload = refreshAllData;
</script>
</body>
</html>
