<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải Cầu Lông - Live Data</title>
    <!-- Sử dụng thư viện PapaParse để đọc CSV từ URL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        .status { text-align: center; color: #666; font-style: italic; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: var(--secondary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .section-title { border-left: 5px solid var(--secondary); padding-left: 10px; margin-top: 40px; color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>🏸 LIVE: GIẢI CẦU LÔNG 2026</h1>
    <p class="status" id="load-status">Đang tải dữ liệu từ Google Sheets...</p>

    <h2 class="section-title">Bảng Xếp Hạng</h2>
    <table id="table-standings"><thead></thead><tbody></tbody></table>

    <h2 class="section-title">Lịch Thi Đấu</h2>
    <table id="table-matches"><thead></thead><tbody></tbody></table>

    <!-- PHẦN MỚI: DANH SÁCH VẬN ĐỘNG VIÊN -->
    <h2 class="section-title">Danh Sách Vận Động Viên</h2>
    <table id="table-players"><thead></thead><tbody></tbody></table>
</div>

<script>
    const sheetLinks = {
        standings: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUoFtqaOaU8pLTLpo6FAd4rdqgH0JPg0tpqP0C8MeiQ9cfD6s9R4-CgDPjbwTicqrGWNzXi25u1dI/pub?gid=0&single=true&output=csv",
        matches: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUoFtqaOaU8pLTLpo6FAd4rdqgH0JPg0tpqP0C8MeiQ9cfD6s9R4-CgDPjbwTicqrGWNzXi25u1dI/pub?gid=1302524989&single=true&output=csv",
        players: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkUoFtqaOaU8pLTLpo6FAd4rdqgH0JPg0tpqP0C8MeiQ9cfD6s9R4-CgDPjbwTicqrGWNzXi25u1dI/pub?gid=315332621&single=true&output=csv"
    };

    function loadSheetData(url, tableId) {
        Papa.parse(url, {
            download: true,
            header: false,
            complete: function(results) {
                const data = results.data;
                const table = document.getElementById(tableId);
                if (!table) return;
                
                const thead = table.querySelector('thead');
                const tbody = table.querySelector('tbody');
                
                thead.innerHTML = "";
                tbody.innerHTML = "";

                data.forEach((row, index) => {
                    // Kiểm tra dòng có dữ liệu thực sự (tránh dòng trống chỉ có dấu phẩy)
                    if (row.join('').trim().length === 0) return; 

                    const tr = document.createElement('tr');
                    row.forEach(cell => {
                        const el = (index === 0) ? document.createElement('th') : document.createElement('td');
                        el.textContent = cell;
                        tr.appendChild(el);
                    });
                    (index === 0) ? thead.appendChild(tr) : tbody.appendChild(tr);
                });
                document.getElementById('load-status').textContent = "Dữ liệu đã được cập nhật mới nhất";
            },
            error: function(err) {
                console.error("Lỗi khi tải dữ liệu cho " + tableId, err);
                document.getElementById('load-status').textContent = "Lỗi khi tải dữ liệu. Kiểm tra lại kết nối hoặc link Sheets.";
            }
        });
    }

    // Gọi hàm load cho cả 3 bảng khi trang web mở ra
    window.onload = function() {
        loadSheetData(sheetLinks.standings, 'table-standings');
        loadSheetData(sheetLinks.matches, 'table-matches');
        loadSheetData(sheetLinks.players, 'table-players');
    };
</script>

</body>
</html>
